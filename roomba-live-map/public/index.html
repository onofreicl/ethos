<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#10131a" />
    <title>Roomba Live Map</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="hud">
      <div class="hud-row">
        <span id="conn" class="dot dot-off"></span>
        <span id="conn-label">connecting…</span>
        <span class="spacer"></span>
        <span id="mock-tag" class="tag" hidden>MOCK</span>
      </div>
      <div class="hud-row stats">
        <span class="stat"><span class="stat-label">battery</span><b id="battery">—</b></span>
        <span class="stat"><span class="stat-label">phase</span><b id="phase">—</b></span>
        <span class="stat"><span class="stat-label">bin</span><b id="bin">—</b></span>
        <span class="stat"><span class="stat-label">points</span><b id="count">0</b></span>
      </div>
    </header>

    <canvas id="map"></canvas>

    <footer id="controls">
      <button id="clear" type="button">Clear path</button>
      <button id="recenter" type="button">Recenter</button>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
